name: Scrape and Update Jobs

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/bot/requirements.txt

      - name: Run Job Scraper & Exporter
        env:
          SEED_MODE: "1" # Set to 1 to ONLY dump to JSON and NEVER send to Telegram
        run: |
          cd scripts/bot
          python main.py

      - name: Commit updated jobs.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated jobs update [skip ci]"
          file_pattern: 'public/data/jobs.json scripts/bot/jobs.db'
